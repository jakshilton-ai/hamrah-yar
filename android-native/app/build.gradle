plugins { id 'com.android.application' }
android {
    namespace 'ir.hamrahyar.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.hamrahyar.app'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
