
name: Build Hamrah Yar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      
      - name: Extract project
        run: |
          unzip -q hamrah_yar_android_build_ready.zip -d app
          cd app
          sed -i '285s/]))));/])))));/' lib/main.dart


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          cd app
          flutter create --platforms=android --org ir.hamrahyar .
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-yar-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
